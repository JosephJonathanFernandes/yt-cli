[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdownloader"
version = "1.0.0"
description = "A polished, terminal-based YouTube downloader CLI built on top of yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YT Downloader CLI Contributors" }]
keywords = ["youtube", "downloader", "cli", "yt-dlp", "video", "audio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp>=2024.8.6",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
extra = [
    "pyperclip>=1.8.2",
    "psutil>=5.9.8",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
ytdownloader = "ytdownloader.main:main"
ytcli = "ytdownloader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
